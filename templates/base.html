{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>گالری نقاشی</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="site-title" href="{% url 'home' %}">گالری نقاشی</a>
        <nav>
          <a href="{% url 'home' %}">خانه</a>
          <a href="/artworks/">آثار</a>
          {% if user.is_authenticated %}
          <a href="{% url 'artworks:my_wishlist' %}">علاقه‌مندی‌ها</a>
          <a href="{% url 'artworks:my_list' %}">آثار من</a>
          {% endif %}
        </nav>
      </div>
    </header>
    <main class="container">
      {% if messages %}{% for m in messages %}
      <p class="message">{{ m }}</p>
      {% endfor %}{% endif %} {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <p>گالری نقاشی — همه‌ی حقوق محفوظ است.</p>
    </footer>
  </body>
</html>
